<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a4d32"/>
      <stop offset="100%" stop-color="#063925"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="20" y1="14" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="16" y1="18" x2="48" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="18" fill="url(#primaryGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Agricultural Sprout & Wheat Emblem -->
  <!-- Left Sprout Leaf -->
  <path d="M32 38 C20 34 16 22 22 16 C28 22 30 30 32 38 Z" fill="url(#leafGrad)"/>
  
  <!-- Right Wheat Head -->
  <path d="M32 38 C44 34 48 22 42 16 C36 22 34 30 32 38 Z" fill="url(#goldGrad)"/>

  <!-- Center Golden Stalk / Spine -->
  <path d="M32 48 L32 20" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Top Sun/Grain Dot -->
  <circle cx="32" cy="14" r="3.5" fill="#f59e0b"/>
  <circle cx="32" cy="14" r="1.5" fill="#ffffff"/>
  
  <!-- Soil base curve -->
  <path d="M22 48 Q32 52 42 48" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
</svg>
